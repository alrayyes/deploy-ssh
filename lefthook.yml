skip_lfs: true

commit-msg:
  commands:
    "lint commit message":
      run: pnpm commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - run: pnpm lint
    - run: docker compose run --rm -T hadolint hadolint Dockerfile
    - run: docker build .

pre-commit:
  parallel: true
  jobs:
    - run: pnpm lint
    - run: docker compose run --rm -T hadolint hadolint Dockerfile
    - run: docker build .
